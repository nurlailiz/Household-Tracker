name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the database rules have your usernames
        run: |
          if grep -q 'USERNAME_[12]@' firestore.rules; then
            echo "::error file=firestore.rules::Replace USERNAME_1 and USERNAME_2 in firestore.rules with your two usernames before deploying."
            exit 1
          fi

      - name: Check the deploy key is set up
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret (see README: Deploying from GitHub)."
            exit 1
          fi

      - name: Deploy app and database rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --only hosting,firestore:rules --project household-tracker-ea124 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
